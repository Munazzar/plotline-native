name: build-and-compare
# On every push to main: build a debuggable APK, screenshot every screen of the 1.13 web build and of the
# native app (Android emulator, same sample data), and publish the side-by-side images to the `shots` branch.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Web build to compare against (local = this repo''s plotline.html, the 1.13 UI)'
        default: 'local'
permissions:
  contents: write
concurrency:
  group: compare
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WEB_URL: ${{ github.event.inputs.web_url || 'local' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build tools
        run: sh scripts/get-tools.sh
      - name: Build debuggable APK (debug-signed; release signing stays off CI)
        shell: bash
        run: |
          mkdir -p ci/out
          set -o pipefail
          DEBUGGABLE=1 sh apkbuild/build.sh 2>&1 | tee ci/out/build.log
          cp apkbuild/out/Plotline-*.apk apkbuild/out/Plotline-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: Plotline-debug-apk, path: apkbuild/out/Plotline-debug.apk, retention-days: 14 }
      - name: Screenshot the 1.13 web build
        shell: bash
        run: |
          set -o pipefail
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium
          if [ "$WEB_URL" = "local" ]; then (cd apkbuild/web && nohup python -m http.server 8765 >/dev/null 2>&1 &); sleep 2; export WEB_URL=http://localhost:8765/index.html; fi
          python ci/web_shots.py 2>&1 | tee ci/out/web.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshot the native app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python ci/emu.py apkbuild/out/Plotline-debug.apk 2>&1 | tee ci/out/emu.log
      - name: Side by side
        if: always()
        run: |
          python ci/compare.py || true
          python ci/layout_diff.py > /dev/null || true
      - name: Publish to the shots branch
        if: always()
        run: |
          set -e
          mkdir -p ci/out; cp -r ci/out /tmp/shots
          echo "commit ${GITHUB_SHA} · run ${GITHUB_RUN_ID} · $(date -u +%FT%TZ)" > /tmp/shots/RUN.txt
          git config user.name "plotline-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan shots-tmp
          git rm -rfq . ; rm -rf ./* .github ci apkbuild scripts native 2>/dev/null || true
          cp -r /tmp/shots/. .
          git add -A; git commit -qm "screens for ${GITHUB_SHA}"
          git push -f origin HEAD:shots
