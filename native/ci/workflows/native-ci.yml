name: native-ci
on:
  push:
    branches: [native-ci]
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Debuggable copy of the APK (same code, debug-signed so run-as works)
        run: |
          java -jar ci/tools/apktool.jar d -f ci/Plotline.apk -o /tmp/d
          sed -i 's/<application /<application android:debuggable="true" /' /tmp/d/AndroidManifest.xml
          java -jar ci/tools/apktool.jar b /tmp/d -o /tmp/u.apk
          java -jar ci/tools/uber-signer.jar --apks /tmp/u.apk --out /tmp/s
          cp /tmp/s/*.apk ci/Plotline-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: sh ci/run-emulator.sh
      - name: Commit screenshots back to the branch
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add ci/out; git commit -m "emulator screenshots [skip ci]" || true; git push
